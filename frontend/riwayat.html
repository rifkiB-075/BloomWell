<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Riwayat Analisis | BloomWell</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/interactivetools.css">
    <style>
        .riwayat-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .riwayat-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .riwayat-header h1 { font-size: 24px; color: #3d2c5e; margin: 0; }
        .riwayat-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .search-input { padding: 8px 14px; border-radius: 30px; border: 1px solid #ddd; font-family: 'Poppins', sans-serif; font-size: 13px; min-width: 180px; }
        .filter-select { padding: 8px 14px; border-radius: 30px; border: 1px solid #ddd; font-family: 'Poppins', sans-serif; font-size: 13px; background: white; }
        .clear-all-btn { padding: 8px 16px; border: none; border-radius: 30px; background: #f5e6e6; color: #721c24; font-weight: 600; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .clear-all-btn:hover { background: #f0d0d0; transform: translateY(-2px); }
        .stats-bar { display: flex; gap: 20px; flex-wrap: wrap; background: #f8f4ff; padding: 12px 20px; border-radius: 16px; margin-bottom: 20px; }
        .stats-item { font-size: 13px; color: #5a4a6e; }
        .stats-item strong { font-weight: 700; }
        .riwayat-list { display: flex; flex-direction: column; gap: 16px; }
        .riwayat-card { background: white; border-radius: 16px; padding: 16px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-left: 4px solid #7c5a9e; transition: all 0.3s; }
        .riwayat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .card-header-riwayat { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .badge-period { background: #e9def5; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #5a3d7a; }
        .badge-status { padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 6px; }
        .badge-status.good { background: #d4edda; color: #155724; }
        .badge-status.moderate { background: #fff3cd; color: #856404; }
        .badge-status.severe { background: #f8d7da; color: #721c24; }
        .badge-status.unknown { background: #e2e3e5; color: #383d41; }
        .date-meta { font-size: 12px; color: #8a7a99; }
        .card-body-riwayat { margin: 8px 0; }
        .summary-text { font-size: 14px; line-height: 1.6; color: #2b1b42; white-space: pre-line; }
        .suggestion-text { margin-top: 8px; font-size: 13px; color: #5a4a6e; background: #f8f6fa; padding: 8px 12px; border-radius: 8px; white-space: pre-line; }
        .card-footer-riwayat { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0ebf5; }
        .mood-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .mood-tag { font-size: 11px; background: #f0ebf5; padding: 2px 10px; border-radius: 20px; color: #5a3d7a; }
        .delete-item-btn { border: none; background: none; color: #d85a30; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.3s; padding: 4px 8px; border-radius: 8px; }
        .delete-item-btn:hover { background: #f5e6e6; }
        .empty-state-riwayat { text-align: center; padding: 40px; background: white; border-radius: 16px; }
        .empty-state-riwayat .big-icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .empty-state-riwayat p { color: #6b5a7e; margin: 4px 0; }
        .nav-link-btn { display: inline-block; padding: 8px 20px; border-radius: 30px; background: #7c5a9e; color: white; text-decoration: none; font-size: 14px; font-weight: 600; margin-top: 12px; transition: all 0.3s; }
        .nav-link-btn:hover { background: #6a4a88; transform: translateY(-2px); }
        .toast-riwayat { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2b1b42; color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.4s; z-index: 9999; }
        .toast-riwayat.show { opacity: 1; }
        .toast-riwayat.error { background: #721c24; }
    </style>
</head>
<body>

    <header class="header">
        <nav class="nav">
            <div class="logo">
                <div class="img-div"><img src="images/logo bloomwell.png" alt="BloomWell Logo"></div>
                <div><h2>BloomWell</h2></div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="resourcelibrary.html">Resources Library</a></li>
                <li><a href="interactiveTools.html" class="active">Interactive Tools</a></li>
                <li><a href="professionalTools.html">Professional Service</a></li>
                <li><a href="emergencyService.html">Emergency Service</a></li>
                <li><a href="user-account.html">Akun</a></li>
            </ul>
        </nav>
    </header>

    <div class="tools-layout">
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle menu">☰</button>
            <nav class="sidebar-nav">
                <a href="interactiveTools.html" class="sidebar-item" title="Mood Meter">
                    <span class="sidebar-icon">🧪</span><span class="sidebar-label">Mood Meter</span>
                </a>
                <a href="kalender.html" class="sidebar-item" title="Kalender Mood">
                    <span class="sidebar-icon">📅</span><span class="sidebar-label">Kalender Mood</span>
                </a>
                <a href="chat-ai.html" class="sidebar-item" title="Chat AI">
                    <span class="sidebar-icon">💬</span><span class="sidebar-label">Chat AI</span>
                </a>
                <a href="analisis.html" class="sidebar-item" title="Analisis AI">
                    <span class="sidebar-icon">📊</span><span class="sidebar-label">Analisis AI</span>
                </a>
                <a href="riwayat.html" class="sidebar-item active" title="Riwayat Analisis">
                    <span class="sidebar-icon">📈</span><span class="sidebar-label">Riwayat Analisis</span>
                </a>
            </nav>
        </aside>

        <main class="tools-main">
            <div class="riwayat-container">
                <div class="riwayat-header">
                    <h1>📜 Riwayat Analisis</h1>
                    <div class="riwayat-controls">
                        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Cari kata kunci...">
                        <select class="filter-select" id="filterPeriod">
                            <option value="all">Semua Periode</option>
                            <option value="weekly">Mingguan</option>
                            <option value="monthly">Bulanan</option>
                        </select>
                        <button class="clear-all-btn" onclick="clearAllData()">🗑️ Hapus Semua</button>
                    </div>
                </div>

                <div class="stats-bar" id="statsBar">
                    <div class="stats-item">📊 Total Analisis: <strong id="totalCount">0</strong></div>
                    <div class="stats-item">✅ Sehat: <strong id="goodCount" style="color:#155724;">0</strong></div>
                    <div class="stats-item">⚠️ Perlu Perhatian: <strong id="moderateCount" style="color:#856404;">0</strong></div>
                    <div class="stats-item">🔴 Risiko Tinggi: <strong id="severeCount" style="color:#721c24;">0</strong></div>
                </div>

                <div class="riwayat-list" id="riwayatList"></div>
            </div>
        </main>
    </div>

    <div class="toast-riwayat" id="toastRiwayat"></div>

    <script>
        // ====================== AUTH GUARD ======================
        (function () {
            const session = localStorage.getItem('bw_session');
            if (!session) {
                window.location.replace('Auth.html?tab=login&redirect=riwayat.html');
                return;
            }
            try {
                const bwSession = JSON.parse(session);
                if (!bwSession.id) {
                    window.location.replace('Auth.html?tab=login&redirect=riwayat.html');
                    return;
                }
            } catch (e) {
                window.location.replace('Auth.html?tab=login&redirect=riwayat.html');
                return;
            }
        })();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toastRiwayat');
            toast.textContent = msg;
            toast.className = 'toast-riwayat' + (isError ? ' error' : '');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function getHistory() {
            return JSON.parse(localStorage.getItem('riwayatHistory')) || [];
        }

        function saveHistory(data) {
            localStorage.setItem('riwayatHistory', JSON.stringify(data));
        }

        function renderRiwayat() {
            const list = document.getElementById('riwayatList');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const filter = document.getElementById('filterPeriod').value;

            let data = getHistory();

            if (filter !== 'all') {
                data = data.filter(item => item.period === filter);
            }

            if (search !== '') {
                data = data.filter(item => {
                    const summary = (item.summary || '').toLowerCase();
                    const suggestions = (item.suggestions || '').toLowerCase();
                    return summary.includes(search) || suggestions.includes(search);
                });
            }

            data.sort((a, b) => (b.id || 0) - (a.id || 0));
            updateStats(data);

            if (data.length === 0) {
                list.innerHTML = `
                    <div class="empty-state-riwayat">
                        <span class="big-icon">📭</span>
                        <p style="font-size:1.1rem;color:#5a3d7a;">Belum ada analisis yang tersimpan.</p>
                        <p style="color:#8a7a9e;">Kunjungi halaman <strong>Analisis AI</strong> untuk membuat analisis pertama Anda.</p>
                        <a href="analisis.html" class="nav-link-btn">📊 Buka Analisis AI</a>
                    </div>
                `;
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const periodLabel = item.period === 'weekly' ? 'Mingguan' : 'Bulanan';
                const status = item.mentalHealthStatus || 'unknown';
                const statusLabel = item.mentalHealthLevel || 'Tidak diketahui';

                let statusBadge = '';
                if (status === 'good') statusBadge = `<span class="badge-status good">✅ ${statusLabel}</span>`;
                else if (status === 'moderate') statusBadge = `<span class="badge-status moderate">⚠️ ${statusLabel}</span>`;
                else if (status === 'severe') statusBadge = `<span class="badge-status severe">🔴 ${statusLabel}</span>`;
                else statusBadge = `<span class="badge-status unknown">❓ ${statusLabel}</span>`;

                const date = new Date(item.savedAt || item.generatedAt);
                const dateStr = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const timeStr = date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

                let moodTags = '';
                if (item.moodCounts && typeof item.moodCounts === 'object' && Object.keys(item.moodCounts).length > 0) {
                    const sorted = Object.entries(item.moodCounts).sort((a, b) => b[1] - a[1]);
                    moodTags = sorted.map(([mood, count]) =>
                        `<span class="mood-tag">${mood} (${count}x)</span>`
                    ).join('');
                }

                const summaryText = (item.summary || '').replace(/\n/g, '<br>');
                const suggestionText = item.suggestions || '';

                html += `
                    <div class="riwayat-card">
                        <div class="card-header-riwayat">
                            <div>
                                <span class="badge-period">${periodLabel}</span>
                                ${statusBadge}
                            </div>
                            <span class="date-meta">📆 ${dateStr} • ${timeStr}</span>
                        </div>
                        <div class="card-body-riwayat">
                            <div class="summary-text">${summaryText}</div>
                            ${suggestionText ? `<div class="suggestion-text"><strong>💡 Saran:</strong> ${suggestionText}</div>` : ''}
                        </div>
                        <div class="card-footer-riwayat">
                            ${moodTags ? `<div class="mood-tags">${moodTags}</div>` : ''}
                            <button class="delete-item-btn" onclick="deleteItem(${index})" title="Hapus analisis ini">✕ Hapus</button>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.length;
            let good = 0, moderate = 0, severe = 0;
            data.forEach(item => {
                if (item.mentalHealthStatus === 'good') good++;
                else if (item.mentalHealthStatus === 'moderate') moderate++;
                else if (item.mentalHealthStatus === 'severe') severe++;
            });
            document.getElementById('goodCount').textContent = good;
            document.getElementById('moderateCount').textContent = moderate;
            document.getElementById('severeCount').textContent = severe;
        }

        function deleteItem(index) {
            const data = getHistory();
            const sorted = [...data].sort((a, b) => (b.id || 0) - (a.id || 0));
            if (index < 0 || index >= sorted.length) return;
            const targetId = sorted[index].id;
            const newData = data.filter(item => item.id !== targetId);
            if (newData.length === data.length) {
                showToast('Gagal menghapus item.', true);
                return;
            }
            saveHistory(newData);
            renderRiwayat();
            showToast('🗑️ Analisis dihapus.');
        }

        function clearAllData() {
            if (!confirm('Hapus SEMUA riwayat?')) return;
            saveHistory([]);
            renderRiwayat();
            showToast('🗑️ Semua riwayat dihapus.');
        }

        document.getElementById('searchInput').addEventListener('input', renderRiwayat);
        document.getElementById('filterPeriod').addEventListener('change', renderRiwayat);
        document.addEventListener('DOMContentLoaded', renderRiwayat);
    </script>
</body>
</html>
